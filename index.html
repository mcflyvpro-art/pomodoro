<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pomodoro</title>
<meta name="description" content="Un minuteur Pomodoro personnalisable qui sonne à la fin de chaque phase.">
<meta name="theme-color" id="themeColor" content="#F4B740">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#24112B; --field:#F4B740; --ink:#FBF3E4;
  --num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --muted:color-mix(in srgb,var(--ink) 62%,transparent);
  --tint:color-mix(in srgb,var(--ink) 7%,transparent);
  --tint2:color-mix(in srgb,var(--ink) 13%,transparent);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--base);color:var(--ink);font:15px/1.45 var(--ui);
  transition:background .6s var(--ease);touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--field);outline-offset:3px;border-radius:8px}

#app{position:fixed;inset:0;overflow:hidden}
/* iOS 26, app installée : 100%, dvh et svh sont trop courts de la hauteur de la barre d'état
   (bande vide en bas). Seul lvh donne la vraie hauteur, et le contenu fixe est coupé :
   on passe donc en flux normal sur une page de 100lvh. */
@media (display-mode: standalone), (display-mode: fullscreen){
  :root{--vh:1lvh}
  html{height:100lvh;position:relative}
  body{position:relative;inset:auto;height:100%}
  #app{position:absolute;inset:0}
}

/* ---------- Le cadran plein écran : deux calques identiques, l'un découpé ---------- */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .6s var(--ease),color .6s var(--ease)}
#below{background:var(--base);color:var(--field)}
#above{background:var(--field);color:var(--base);clip-path:inset(0 0 0 0);will-change:clip-path}
#above.anim{transition:clip-path .9s var(--ease),background .6s var(--ease),color .6s var(--ease)}
.digits{display:flex;align-items:center;font:800 min(calc(var(--vh,1vh)*44),33vw)/.82 var(--num)}
.digits.hours{font-size:min(calc(var(--vh,1vh)*36),22vw)}
.grp{display:flex}
.digits i{font-style:normal;display:inline-block;width:.52em;text-align:center}
.digits i.pl{width:.42em}
.sep{width:.24em;text-align:center}
.caption{margin-top:calc(var(--vh,1vh)*3.2);font:500 clamp(15px,1.5vw,20px)/1.2 var(--ui);opacity:.85;min-height:1.2em;text-align:center;padding:0 24px}

/* ---------- Interface ---------- */
.chrome{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:22px max(28px,calc(var(--sr) + 16px)) 22px max(28px,calc(var(--sl) + 16px));pointer-events:none;transition:opacity .5s ease}
.chrome > *{pointer-events:auto}
#top{top:0;padding-top:max(22px,calc(var(--st) + 10px))}
#bottom{bottom:0;justify-content:center;padding-bottom:max(22px,calc(var(--sb) + 12px))}
body.idle .chrome{opacity:0}
body.idle .chrome *{pointer-events:none}
body.idle{cursor:none}

.pill{background:color-mix(in srgb,var(--base) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:999px;padding:5px;display:flex;align-items:center;gap:2px;box-shadow:0 10px 30px -12px rgb(0 0 0/.5);
  transition:background .6s var(--ease)}

.phases button{padding:9px 16px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;transition:color .2s,background .3s}
.phases button[aria-pressed=true]{background:var(--field);color:var(--base)}

.dots{padding:12px 16px;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--field);transition:background .4s}
.dots i.on{background:var(--field)}
.dots b{font-weight:500;margin-left:6px;color:color-mix(in srgb,var(--ink) 70%,transparent);font-size:13px;white-space:nowrap}

.controls{padding:6px;gap:6px}
.icon{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .2s,transform .15s}
.icon:active{transform:scale(.92)}
.icon svg{width:20px;height:20px}
#sound{color:var(--field);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#toggle{height:46px;min-width:150px;padding:0 26px;border-radius:999px;background:var(--field);color:var(--base);font-weight:600;font-size:16px;
  transition:transform .15s,background .6s var(--ease),color .6s var(--ease)}
#toggle:active{transform:scale(.96)}
.divider{width:1px;height:24px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 4px}

/* ---------- Réglages : tiroir latéral (PC) / feuille du bas (mobile) ---------- */
#scrim{position:absolute;inset:0;z-index:8;background:rgb(0 0 0/.4);opacity:0;pointer-events:none;transition:opacity .3s}
#drawer{position:absolute;top:12px;right:12px;bottom:12px;width:min(380px,calc(100vw - 24px));z-index:9;
  background:color-mix(in srgb,var(--base) 94%,#fff);border-radius:22px;padding:24px 22px 26px;overflow:auto;overscroll-behavior:contain;
  transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease),background .6s var(--ease);
  box-shadow:0 30px 80px -20px rgb(0 0 0/.6)}
body.open #drawer{transform:none}
body.open #scrim{opacity:1;pointer-events:auto}
.grabber{display:none}
#drawer h2{font:800 32px/1 var(--num);margin:0 0 18px;color:var(--field);letter-spacing:.5px}
.close{position:absolute;top:16px;right:14px}
.stabs{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--tint);margin-bottom:20px}
.stabs button{flex:1;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .25s,color .25s}
.stabs button svg{width:20px;height:20px}
.stabs button[aria-selected=true]{background:var(--field);color:var(--base)}
.panel{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.sub{font-size:13px;font-weight:600;margin:20px 0 10px;color:color-mix(in srgb,var(--ink) 55%,transparent)}
.panel > .sub:first-child{margin-top:0}

.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pwrap{position:relative;display:grid}
.preset{padding:12px 6px;border-radius:14px;background:var(--tint);text-align:center;transition:background .2s,transform .15s}
.preset:active{transform:scale(.97)}
.preset.on{background:var(--field);color:var(--base)}
.preset strong{display:block;font:800 22px/1 var(--num)}
.preset small{font-size:12px;opacity:.7}
.preset.add{border:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:none}
.del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--base);color:var(--ink);
  font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 25%,transparent);opacity:.85}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
.row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;background:var(--tint);border-radius:12px}
.stepper button{width:38px;height:38px;font-size:19px;color:color-mix(in srgb,var(--ink) 75%,transparent);border-radius:12px}
.stepper input{width:56px;text-align:center;background:none;border:0;font-weight:600;font-size:16px;-moz-appearance:textfield;appearance:textfield;-webkit-user-select:text;user-select:text}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s var(--ease)}
.switch:checked{background:var(--field)}
.switch:checked::after{transform:translateX(18px);background:var(--base)}
input[type=range]{width:150px;accent-color:var(--field)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:999px;background:var(--tint);font-size:14px;font-weight:500;transition:background .2s,color .2s}
.chip.on{background:var(--field);color:var(--base)}

.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(255 255 255/.12);transition:transform .15s}
.swatch.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--base) 94%,#fff),0 0 0 5px var(--ink)}
.swatch:active{transform:scale(.93)}

.btn{margin-top:14px;width:100%;padding:13px;border-radius:14px;background:var(--tint);font-weight:500;transition:background .2s}
.btn.primary{background:var(--field);color:var(--base);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;color:color-mix(in srgb,var(--ink) 75%,transparent)}
kbd{font:600 12px/1 var(--ui);padding:5px 8px;border-radius:7px;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);justify-self:start}
.ios{font-size:14px;color:color-mix(in srgb,var(--ink) 75%,transparent);margin:0}
.ios svg{width:16px;height:16px;vertical-align:-3px}

@media (hover:none){ .keys-block{display:none} }
@media (hover:hover){
  .phases button:hover{color:var(--ink)}
  .icon:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
  #toggle:hover{transform:scale(1.03)}
  .preset:hover,.chip:hover,.btn:hover{background:var(--tint2)}
  .preset.on:hover,.chip.on:hover{background:var(--field)}
  .stepper button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
  .stabs button:hover{color:var(--ink)}
  .stabs button[aria-selected=true]:hover{color:var(--base)}
  .del{opacity:0;transition:opacity .2s}
  .pwrap:hover .del{opacity:1}
}

/* ---------- Mobile portrait ---------- */
@media (max-width:640px){
  #top{flex-direction:column;gap:10px;padding-left:max(14px,var(--sl));padding-right:max(14px,var(--sr))}
  .phases{width:100%;max-width:420px}
  .phases button{flex:1;padding:11px 6px;font-size:14px}
  .dots{padding:9px 14px}
  #bottom{padding-left:max(14px,var(--sl));padding-right:max(14px,var(--sr))}
  .controls{width:100%;max-width:420px;padding:7px;gap:4px}
  .icon{width:52px;height:52px}
  .icon svg{width:22px;height:22px}
  #toggle{flex:1;min-width:0;height:56px;font-size:18px}
  .divider{display:none}

  #drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:calc(var(--vh,1vh)*88);border-radius:26px 26px 0 0;
    padding:8px 18px calc(var(--sb) + 24px);transform:translateY(105%)}
  .grabber{display:block;width:40px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 25%,transparent);margin:2px auto 14px}
  .close{top:16px;right:10px}
  #drawer h2{font-size:28px;margin-bottom:14px}
}
@media (max-aspect-ratio:4/5){
  .digits{flex-direction:column;font-size:min(84vw,calc(var(--vh,1vh)*28));line-height:.86}
  .digits.hours{font-size:min(60vw,calc(var(--vh,1vh)*20))}
  .sep{display:none}
  .caption{margin-top:calc(var(--vh,1vh)*2.6);font-size:16px}
}
/* ---------- Téléphone en paysage ---------- */
@media (max-height:520px) and (min-aspect-ratio:4/5){
  .chrome{padding-top:max(10px,var(--st));padding-bottom:max(10px,var(--sb))}
  .digits{font-size:min(calc(var(--vh,1vh)*58),30vw)}
  .caption{margin-top:calc(var(--vh,1vh)*1.5);font-size:14px}
  .phases button{padding:7px 12px}
  .icon{width:42px;height:42px}
  #toggle{height:42px}
  #drawer{top:8px;bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}
}
</style>
</head>
<body>
<div id="app">
<div id="below" class="layer" aria-hidden="true"></div>
<div id="above" class="layer" aria-hidden="true"></div>
<template id="face"><div class="digits"></div><div class="caption"></div></template>
<div id="sr" role="timer" aria-live="off" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<header id="top" class="chrome">
  <nav class="pill phases" aria-label="Phase">
    <button data-p="work">Focus</button>
    <button data-p="short">Pause courte</button>
    <button data-p="long">Pause longue</button>
  </nav>
  <div class="pill dots" id="dots" title="Sessions de Focus terminées aujourd'hui"></div>
</header>

<footer id="bottom" class="chrome">
  <div class="pill controls">
    <button class="icon" id="reset" title="Recommencer la phase (R)" aria-label="Recommencer la phase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button id="toggle">Démarrer</button>
    <button class="icon" id="skip" title="Passer à la suite (S)" aria-label="Passer à la suite">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 5 5.5Z"/><rect x="17.5" y="5" width="2.2" height="14" rx="1.1"/></svg>
    </button>
    <span class="divider"></span>
    <button class="icon" id="sound" title="Activer le son" aria-label="Activer le son" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
    <button class="icon" id="pip" title="Mini-fenêtre (P)" aria-label="Mini-fenêtre flottante" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="5" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="icon" id="fs" title="Plein écran (F)" aria-label="Plein écran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="icon" id="openSettings" title="Réglages" aria-label="Réglages" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-label="Réglages" inert>
  <div class="grabber"></div>
  <button class="icon close" id="closeSettings" aria-label="Fermer les réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <h2 id="stitle">Minuteur</h2>

  <nav class="stabs" role="tablist" aria-label="Sections des réglages">
    <button role="tab" data-tab="timer" title="Minuteur" aria-label="Minuteur" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    </button>
    <button role="tab" data-tab="sound" title="Son" aria-label="Son" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <button role="tab" data-tab="pause" title="Pause" aria-label="Pause" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.2-6"/></svg>
    </button>
    <button role="tab" data-tab="look" title="Affichage" aria-label="Affichage" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.3" fill="currentColor"/><circle cx="17.5" cy="10.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="7.5" r="1.3" fill="currentColor"/><circle cx="6.5" cy="12.5" r="1.3" fill="currentColor"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7h2a5.6 5.6 0 0 0 5.6-5.6C22 6 17.5 2 12 2Z"/></svg>
    </button>
    <button role="tab" data-tab="device" title="Appareil" aria-label="Appareil" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
    </button>
  </nav>

  <section class="panel" data-panel="timer">
    <div class="presets" id="presets"></div>
    <div class="sub">Durées (minutes)</div>
    <div class="row"><label for="work">Focus</label><div class="stepper"><button data-step="work,-1" aria-label="Moins">−</button><input id="work" type="number" min="0.1" max="600" step="any" inputmode="decimal"><button data-step="work,1" aria-label="Plus">+</button></div></div>
    <div class="row"><label for="short">Pause courte</label><div class="stepper"><button data-step="short,-1" aria-label="Moins">−</button><input id="short" type="number" min="0.1" max="600" step="any" inputmode="decimal"><button data-step="short,1" aria-label="Plus">+</button></div></div>
    <div class="row"><label for="long">Pause longue</label><div class="stepper"><button data-step="long,-1" aria-label="Moins">−</button><input id="long" type="number" min="0.1" max="600" step="any" inputmode="decimal"><button data-step="long,1" aria-label="Plus">+</button></div></div>
    <div class="row"><label for="every">Pause longue après</label><div class="stepper"><button data-step="every,-1" aria-label="Moins">−</button><input id="every" type="number" min="1" max="20" step="1" inputmode="numeric"><button data-step="every,1" aria-label="Plus">+</button></div></div>
    <div class="sub">Déroulement</div>
    <div class="row"><label for="auto">Enchaîner les phases</label><input id="auto" data-k="auto" class="switch" type="checkbox"></div>
    <div class="row"><label for="flow">Mode flow</label><input id="flow" data-k="flow" class="switch" type="checkbox"></div>
    <div class="row"><label for="remind">Rappel après 2 min</label><input id="remind" data-k="remind" class="switch" type="checkbox"></div>
  </section>

  <section class="panel" data-panel="sound" hidden>
    <div class="sub">Fin du Focus</div>
    <div class="chips" id="sndWork" data-chip="sndWork"></div>
    <div class="sub">Fin de pause</div>
    <div class="chips" id="sndBreak" data-chip="sndBreak"></div>
    <div class="sub">Ambiance pendant le Focus</div>
    <div class="chips" id="ambient" data-chip="ambient"></div>
    <div class="sub"></div>
    <div class="row"><label for="sndStart">Son au démarrage</label><input id="sndStart" data-k="sndStart" class="switch" type="checkbox"></div>
    <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100"></div>
    <div class="row" id="ambVolRow"><label for="ambVol">Volume ambiance</label><input id="ambVol" type="range" min="0" max="100"></div>
  </section>

  <section class="panel" data-panel="pause" hidden>

  else if (k === 'p' && !$('pip').hidden) togglePip();
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && e.target.closest('button') && !document.body.classList.contains('open')) e.preventDefault(); });
window.addEventListener('beforeunload', e => { if (running && !isStandalone) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Démarrage : reprise de l'état, puis raccourcis d'app (?start=work&min=50) ---------- */
function restore() {
  const s = store.get('pomodoro-state');
  if (!s || !LABEL[s.phase]) return false;
  phase = s.phase;
  done = s.day === today() ? Math.max(0, Math.round(num(s.done, 0, 999, 0))) : 0;
  total = num(s.total, 1000, 600 * 60000, dur(phase));
  left = num(s.left, 0, total, total);
  running = !!s.running && Number.isFinite(s.endAt);
  endAt = running ? s.endAt : 0;
  over = running && !!s.over && Number.isFinite(s.overStart);
  overStart = over ? s.overStart : 0;
  tip = pickTip();
  applyColors();
  if (over && Date.now() - overStart > 12 * 3600e3) { setPhase('work'); return true; }
  if (running && !over) {
    if (Date.now() >= endAt) advance(true);
    else timer = setTimeout(check, endAt - Date.now() + 30);
  }
  render(true);
  return true;
}
function fromUrl() {
  const q = new URLSearchParams(location.search), p = q.get('start');
  if (!p) return;
  history.replaceState(null, '', location.pathname);
  if (!LABEL[p]) return;
  const min = num(q.get('min'), 0.1, 600, 0);
  setPhase(p, min ? Math.round(min * 60000) : 0);
  start(false);
}

fillInputs();
updateInstall();
if (!restore()) setPhase('work');
fromUrl();
if (cfg.push && pushSupported) {
  navigator.serviceWorker.ready.then(r => r.pushManager.getSubscription()).then(s => {
    if (s) pushSub = s.toJSON(); else { cfg.push = false; save(); fillInputs(); }
  }).catch(() => {});
}
requestAnimationFrame(frame);
})();
</script>
